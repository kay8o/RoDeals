<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoDeals</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body class="popup">

    <div class="header">
        <img src="icon48.png" class="logo" alt="">
        <h1>RoDeals</h1>
    </div>

    <section class="card">
        <label for="gameLink"><h2>Your Roblox game link</h2></label>
        <div class="link-row">
            <input id="gameLink" type="text" inputmode="url" spellcheck="false" autocomplete="off"
                   placeholder="roblox.com/games/1234567890/">
            <button class="btn btn-green" id="saveLink" type="button">Save</button>
        </div>
        <p class="status" id="linkStatus" role="status" aria-live="polite"></p>
        <p class="hint">Use a game you own: Roblox pays the 40% commission to the game's owner.</p>
        <div class="link-actions">
            <button class="btn-text" id="testLink" type="button">Test link</button>
            <button class="btn-text" id="resetLink" type="button" hidden>Use default game</button>
        </div>
    </section>

    <section class="card">
        <label class="toggle">
            <span class="toggle-text">Full-screen reminder</span>
            <input type="checkbox" id="popupToggle" role="switch">
        </label>
        <label class="toggle">
            <span class="toggle-text">Item page button</span>
            <input type="checkbox" id="buttonToggle" role="switch">
        </label>
        <label class="toggle">
            <span class="toggle-text">Unsupported item warnings</span>
            <input type="checkbox" id="warningsToggle" role="switch">
        </label>
    </section>

    <button class="btn btn-dark" id="openOptions" type="button">More settings</button>

    <script src="common.js"></script>
    <script src="settings-ui.js"></script>
</body>
</html>
